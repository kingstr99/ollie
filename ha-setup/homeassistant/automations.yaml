# Paste this whole file into /homeassistant/automations.yaml (File editor), replacing what's there.
# Then: Settings > Automations & scenes > (⋮) Reload automations.

# Doorbell presses are handled by the Reolink app's full-screen call (by choice).

- id: doorbell_motion_picture
  alias: Doorbell - motion or person - picture notification
  description: >
    Snapshot + notification on any motion or person at the front door.
    At most one alert per minute; skipped for 30 s after a doorbell press
    (Reolink already shows its full-screen call then).
  mode: single
  triggers:
    - trigger: state
      entity_id: binary_sensor.front_door_person
      to: "on"
    - trigger: state
      entity_id: binary_sensor.front_door_motion
      to: "on"
  conditions:
    - condition: template
      value_template: >
        {{ (now() - states.binary_sensor.front_door_visitor.last_changed).total_seconds() > 30 }}
  actions:
    - variables:
        file: "doorbell/motion_{{ now().strftime('%Y%m%d_%H%M%S') }}.jpg"
    - action: camera.snapshot
      target:
        entity_id: camera.front_door_fluent
      data:
        filename: "/media/{{ file }}"
    - delay: { seconds: 1 }
    - variables:
        is_person: "{{ is_state('binary_sensor.front_door_person', 'on') }}"
    - action: notify.mobile_app_ollie_s25_ultra
      data:
        title: "{{ '🚶 Person at the front door' if is_person else '👀 Motion at the front door' }}"
        message: "{{ now().strftime('%H:%M') }}"
        data:
          image: "/media/local/{{ file }}"
          channel: Doorbell motion
          importance: high
          priority: high
          ttl: 0
          tag: doorbell_motion
          clickAction: "entityId:camera.front_door_fluent"
          actions:
            - action: URI
              title: "Live view"
              uri: "entityId:camera.front_door_fluent"
    - delay: { seconds: 60 }

- id: doorbell_snapshot_cleanup
  alias: Doorbell - clean up old snapshots
  description: Deletes doorbell snapshots older than 14 days, nightly at 03:17.
  mode: single
  triggers:
    - trigger: time
      at: "03:17:00"
  actions:
    - action: shell_command.cleanup_doorbell_snapshots

- id: ha_started_notification
  alias: Home Assistant - started notification
  description: Tells you when HA comes back up (e.g. after a Windows restart).
  mode: single
  triggers:
    - trigger: homeassistant
      event: start
  actions:
    - action: notify.mobile_app_ollie_s25_ultra
      data:
        title: "Home Assistant is online"
        message: "Started at {{ now().strftime('%H:%M %d %b') }}"
